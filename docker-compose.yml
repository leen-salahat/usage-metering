# Full stack: PostgreSQL + usage metering service + example client.
#   docker compose up --build
name: metering-stack

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  service:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@postgres:5432/${POSTGRES_DB:-metering}
      PORT: "3000"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
    ports:
      - "${SERVICE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Runs the demo scenario once against the real service and exits (code 0 = all rules behaved as expected).
  client:
    build: ./client
    environment:
      METERING_URL: http://service:3000
    depends_on:
      service:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
